x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__FERNET_KEY: "Zp8kP1sJx7QhE3vN6yR2tU9wA4cF0dG5hJ7kL1mN3oQ="
  AIRFLOW__WEBSERVER__SECRET_KEY: "bionicpro-airflow-secret"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
  SOURCES_DSN: postgresql://bionicpro:bionicpro@sources_db:5432/bionicpro
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: bionicpro
  CLICKHOUSE_USER: bionicpro
  CLICKHOUSE_PASSWORD: bionicpro

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"

  sources_db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionicpro
      POSTGRES_PASSWORD: bionicpro
    volumes:
      - ./sources/init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionicpro -d bionicpro"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user bionicpro --password bionicpro --query 'SELECT 1' || exit 1
      interval: 5s
      timeout: 5s
      retries: 30

  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow_init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Air --lastname Flow --role Admin --email admin@example.com || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow_db:
        condition: service_healthy

  airflow_webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    command: webserver
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  airflow_scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow_init:
        condition: service_completed_successfully
      sources_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data
    volumes:
      - minio_storage:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  cdn:
    image: nginx:alpine
    environment:
      CDN_SECRET: bionicpro-cdn-secret
      CDN_ALLOWED_ORIGIN: http://localhost:3000
      NGINX_ENVSUBST_FILTER: "CDN_"
    volumes:
      - ./nginx/cdn.conf.template:/etc/nginx/templates/cdn.conf.template:ro
    ports:
      - "8090:8080"
    depends_on:
      minio:
        condition: service_healthy

  reports-service:
    build:
      context: ./reports-service
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8001"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minio_user
      S3_SECRET_KEY: minio_password
      S3_BUCKET: reports
      S3_USE_SSL: "false"
      S3_RETENTION_DAYS: "30"
      CDN_BASE_URL: http://localhost:8090
      CDN_SECRET: bionicpro-cdn-secret
      CDN_LINK_TTL: 15m
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      REQUIRED_ROLE: prothetic_user
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
    ports:
      - "8001:8001"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LISTEN_ADDR: ":8000"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret
      REDIRECT_URI: http://localhost:8000/auth/callback
      FRONTEND_URL: http://localhost:3000
      REPORTS_API_URL: http://reports-service:8001
      REDIS_ADDR: redis:6379
      SESSION_TTL: 30m
      SESSION_COOKIE_NAME: bp_session
      COOKIE_SECURE: "true"
      SESSION_ENC_KEY: "nAyhXnKdzKazWkJDlBFCb3HXXAhSZYrv0UFdOAT6x4U="
    depends_on:
      - redis
      - keycloak
      - reports-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

volumes:
  minio_storage: {}
